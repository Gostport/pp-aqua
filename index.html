<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-t="home.title">Мои аквариумы</title>
<style>
  :root {
    --ink: #eaf6ff;
    --muted: #8aa6bd;
    --dim: #5f7c94;
    --card: rgba(9, 24, 40, 0.72);
    --line: rgba(140, 200, 255, 0.16);
    --accent: #58d6ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(1200px 800px at 20% -10%, #0d4a6b 0%, transparent 60%),
      radial-gradient(900px 700px at 90% 10%, #0a3a5c 0%, transparent 55%),
      linear-gradient(180deg, #051624 0%, #030d17 100%);
    background-attachment: fixed;
    color: var(--ink);
    font: 15px/1.6 "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  body::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(
      100deg, transparent 0 60px,
      rgba(140, 220, 255, 0.035) 60px 90px,
      transparent 90px 190px);
    mask-image: linear-gradient(180deg, #000 0%, transparent 70%);
    -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 70%);
    animation: drift 22s ease-in-out infinite alternate;
  }
  @keyframes drift { from { transform: translateX(-30px); } to { transform: translateX(30px); } }

  .wrap { max-width: 980px; margin: 0 auto; padding: 64px 24px 80px; position: relative; }

  .head {
    display: flex; align-items: flex-start; gap: 24px; flex-wrap: wrap;
    margin-bottom: 36px;
  }
  header { flex: 1 1 340px; }

  /* Четыре шага пути: пока своих аквариумов нет, они и есть главная. */
  .how { margin: 0 0 36px; }
  .hsteps {
    list-style: none; counter-reset: step; margin: 0 0 14px; padding: 0;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 12px;
  }
  .hsteps li {
    counter-increment: step; position: relative;
    display: flex; flex-direction: column; gap: 8px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 16px 15px; font-size: 14px;
  }
  .hsteps li::before {
    content: counter(step);
    position: absolute; top: 10px; right: 13px;
    font-size: 12px; color: var(--dim);
  }
  .hsteps .ico { font-size: 24px; line-height: 1; }
  .how .need { margin: 0 0 14px; color: var(--muted); font-size: 13.5px; }
  h1 { margin: 0 0 12px; font-size: clamp(30px, 5vw, 48px); line-height: 1.05; font-weight: 650; letter-spacing: -0.5px; }
  header p { margin: 0; color: var(--muted); font-size: 16.5px; max-width: 620px; }

  .tanks { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; margin-bottom: 32px; }

  .tank {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    overflow: hidden; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    display: flex; flex-direction: column;
    color: var(--ink); text-decoration: none;
    transition: transform .2s cubic-bezier(.2,.7,.2,1), border-color .2s, box-shadow .2s;
  }
  .tank:hover { transform: translateY(-3px); border-color: rgba(88,214,255,.45); box-shadow: 0 20px 54px rgba(0,20,40,.5); }

  /* Окошко в аквариум. Снимок делает сама сцена, когда там что-то меняется;
     пока его нет — показываем фон аквариума, он известен всегда. */
  .tank .shot {
    position: relative; aspect-ratio: 16 / 9; background: #0a1c2b;
    display: block; overflow: hidden;
  }
  .tank .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tank .shot .veil {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, transparent 45%, rgba(6,18,30,.85) 100%);
  }
  /* Заглушка, пока ни снимка, ни фона: аквариум пустой и ещё не открывался */
  .tank .shot .none {
    position: absolute; inset: 0; display: grid; place-content: center; gap: 6px;
    color: var(--dim); font-size: 13px; text-align: center;
  }
  .tank .shot .none .big { font-size: 30px; line-height: 1; }
  .tank .shot .fade { opacity: 0; transition: opacity .35s }
  .tank .shot .fade.on { opacity: 1 }

  .tank .body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 3px; }
  .tank h2 { margin: 0; font-size: 18px; font-weight: 620; letter-spacing: -.2px; }
  .tank .meta { color: var(--muted); font-size: 13px; }
  .tank .meta code {
    color: var(--dim); font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 12px; letter-spacing: .5px;
  }

  /* Удаление — крестик в углу картинки, как у плиток фона в админке:
     в ряду кнопок он занимал место и притягивал взгляд сильнее «Открыть».
     Виден всегда, только приглушённо: на телефоне наведения нет, и всплывающий
     по нему крестик стоил бы лишнего тапа — первый показывал бы кнопку,
     и только второй открывал аквариум. */
  .tank .kill {
    position: absolute; top: 10px; right: 10px; z-index: 1;
    width: 28px; height: 28px; border-radius: 50%; padding: 0;
    border: 1px solid rgba(140,200,255,.25); background: rgba(4,16,28,.72);
    color: var(--muted); font-size: 15px; line-height: 1; cursor: pointer;
    display: grid; place-content: center; opacity: .5;
    backdrop-filter: blur(4px); transition: opacity .15s, background .15s, color .15s;
  }
  .tank:hover .kill, .tank .kill:focus-visible { opacity: 1 }
  .tank .kill:hover { background: #4a1d24; color: #ff9aa6; border-color: #7a2b36 }

  /* Кнопки-«таблетки»: «Открыть» у поля кода и демо-аквариум в шагах. */
  .btn {
    appearance: none; cursor: pointer; font: inherit; font-size: 13.5px;
    text-align: center; text-decoration: none; display: inline-block;
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px;
    background: rgba(88, 214, 255, .08); color: var(--ink);
    transition: background .15s, border-color .15s, color .15s;
  }
  .btn:hover { background: rgba(88, 214, 255, .18); border-color: rgba(140, 200, 255, .45); }

  .newtank {
    border: 1.5px dashed var(--line); border-radius: 18px;
    display: grid; place-content: center; gap: 6px; text-align: center;
    color: var(--muted); cursor: pointer; background: transparent;
    font: inherit; padding: 34px 20px; min-height: 200px;
    transition: border-color .15s, color .15s;
  }
  .newtank:hover { border-color: var(--accent); color: var(--accent); }
  .newtank .plus { font-size: 30px; line-height: 1; }

  .empty { color: var(--muted); padding: 10px 0 26px; }

  .bycode {
    max-width: 460px; margin: 0 0 40px;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 16px 18px;
  }
  .langrow { display: flex; justify-content: flex-end; margin: 6px 0 0; }
  .langpick { display: inline-flex; gap: 4px; }
  .langpick button {
    appearance: none; cursor: pointer; font: inherit; font-size: 11.5px; letter-spacing: .5px;
    padding: 3px 8px; border-radius: 8px; border: 1px solid transparent;
    background: transparent; color: var(--dim);
    transition: color .15s, background .15s, border-color .15s;
  }
  .langpick button:hover { color: var(--ink); }
  .langpick button[aria-pressed="true"] {
    color: var(--accent); border-color: var(--line); background: rgba(88,214,255,.08);
  }

  .bycode h3 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
  .bycode p { margin: 0 0 12px; color: var(--muted); font-size: 12.5px; }
  .bycode form { display: flex; gap: 10px; flex-wrap: wrap; }
  .bycode input {
    flex: 1; min-width: 150px; font: inherit; font-size: 13.5px;
    letter-spacing: 2px; font-family: ui-monospace, Consolas, monospace;
    background: rgba(4,16,28,.6); color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px;
  }
  .bycode input:focus { outline: none; border-color: var(--accent); }

  footer { padding-top: 24px; border-top: 1px solid var(--line); color: var(--dim); font-size: 13px; }
  footer a { color: var(--muted); }
  footer code {
    background: rgba(140,200,255,.08); border: 1px solid var(--line);
    border-radius: 5px; padding: 2px 7px; color: var(--muted);
    font-family: ui-monospace, Consolas, monospace; font-size: 12.5px;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <header>
      <h1 data-t="home.title">Мои аквариумы</h1>
      <p data-t="home.lead"></p>
    </header>
    <div class="langrow"><span id="lang"></span></div>
  </div>

  <!-- Четыре шага пути — для того, кто пришёл впервые. У кого уже есть свой
       аквариум, тот дорогу знает, и блок ему не показывается. -->
  <div class="how" id="how" hidden>
    <ol class="hsteps">
      <li><span class="ico">🖨️</span><span data-t="home.how.s1"></span></li>
      <li><span class="ico">🖍️</span><span data-t="home.how.s2"></span></li>
      <li><span class="ico">📷</span><span data-t="home.how.s3"></span></li>
      <li><span class="ico">📺</span><span data-t="home.how.s4"></span></li>
    </ol>
    <p class="need" data-t="home.how.need"></p>
    <a class="btn demo" id="demo" data-t="home.how.demo" hidden></a>
  </div>

  <div class="empty" id="empty" data-t="home.empty" hidden></div>
  <div class="tanks" id="tanks"></div>

  <!-- Код нужен только второму устройству, а не новичку, поэтому поле стоит
       после списка: кто пришёл с кодом, тот его ищет — и найдёт, а новичка
       оно раньше только путало: «какой ещё код?». -->
  <div class="bycode">
    <h3 data-t="home.bycode.title"></h3>
    <p data-t="home.bycode.hint"></p>
    <form id="code-form">
      <input id="code" data-t-ph="home.bycode.placeholder" autocomplete="off" spellcheck="false" maxlength="10">
      <button class="btn" type="submit" data-t="home.bycode.open"></button>
    </form>
  </div>

  <footer>
    <p style="margin:0 0 8px"><a href="/terms.html" data-t="home.terms"></a></p>
    <p style="margin:0"><b style="color:var(--ink)" data-t="home.footer.important"></b><span data-t="home.footer.text"></span></p>
  </footer>

</div>

<script src="/assets/i18n.js"></script>
<script src="/assets/modal.js"></script>
<script src="/assets/tank.js"></script>
<script>
(function () {
  'use strict';

  var box = document.getElementById('tanks');
  var empty = document.getElementById('empty');

  I18N.mount(document.getElementById('lang'));
  document.title = I18N.t('home.title');
  // Смена языка перерисовывает карточки: в них счётчик рыбок и подписи.
  addEventListener('aqua:lang', function () { document.title = I18N.t('home.title'); render(); });

  // Карточка целиком — ссылка в аквариум. Отдельных кнопок нет: «Открыть»
  // дублировало нажатие на саму карточку, а управление живёт в меню
  // аквариума, рядом с тем, чем управляют.
  function card(meta) {
    var el = document.createElement('a');
    el.className = 'tank';
    el.href = '/t/' + meta.id;
    el.innerHTML =
      '<div class="shot">' +
        '<div class="none"><span class="big">🫧</span><span>' + I18N.t('home.card.empty') + '</span></div>' +
        '<div class="veil"></div>' +
        '<button class="kill" title="' + I18N.t('home.card.kill') + '">✕</button>' +
      '</div>' +
      '<div class="body">' +
        '<h2></h2>' +
        '<div class="meta"></div>' +
      '</div>';

    el.querySelector('h2').textContent = meta.name;
    var m = el.querySelector('.meta');
    m.textContent = fishWord(meta.fishCount) + ' · ';
    var code = document.createElement('code');
    code.textContent = meta.id;
    m.appendChild(code);

    var shot = el.querySelector('.shot');

    // Снимок сцены, а если его ещё не делали — хотя бы фон аквариума.
    // Появляется плавно: подстановка готовой картинки рывком выглядит дёшево.
    var pic = meta.preview || meta.backgroundUrl;
    if (pic) {
      // Заглушку убираем совсем: она лежит поверх картинки и иначе
      // просвечивала бы сквозь неё.
      shot.querySelector('.none').remove();
      var img = document.createElement('img');
      img.className = 'fade';
      img.alt = '';
      img.loading = 'lazy';
      img.onload = function () { img.classList.add('on'); };
      img.src = pic;
      shot.insertBefore(img, shot.firstChild);
    }

    el.querySelector('button.kill').onclick = function (e) {
      e.preventDefault();      // крестик лежит внутри ссылки на аквариум
      e.stopPropagation();
      // Два разных действия за одним крестиком. Аквариум, открытый по коду,
      // чужой: убрать его из своего списка человек вправе всегда, а удалить
      // насовсем — только с паролем. Раньше было одно «Удалить», и чужой
      // аквариум оставался в списке навсегда.
      Modal.choose({
        title: I18N.t('home.remove.title', { name: meta.name }),
        text: I18N.t('home.remove.text', {
          code: meta.id,
          what: meta.fishCount ? fishWord(meta.fishCount) : I18N.t('home.remove.whatEmpty')
        }),
        image: pic,
        caption: meta.name,
        buttons: [
          { label: I18N.t('home.remove.cancel'), value: null },
          { label: I18N.t('home.remove.forget'), value: 'forget' },
          { label: I18N.t('home.remove.delete'), value: 'delete', kind: 'danger' }
        ]
      }).then(function (what) {
        if (!what) return;
        if (what === 'forget') { Tank.forget(meta.id); render(); return; }

        // Удаление — под паролем. Если его тут не знают (открыли по коду
        // на чужом устройстве), спрашиваем и пробуем ещё раз.
        var kill = function () {
          return Tank.send('/api/t/' + meta.id, { method: 'DELETE', tank: meta.id });
        };
        kill().then(function (r) {
          if (r.ok) return true;
          if (r.status !== 401 && r.status !== 429) return false;
          return Tank.askPass(meta.id, {
            title: I18N.t('home.remove.pass.title', { name: meta.name }),
            text: I18N.t('home.remove.pass.text')
          }).then(function (got) {
            return got ? kill().then(function (r2) { return r2.ok; }) : false;
          });
        }, function () { return false; })
          .then(function (done) { if (done) { Tank.forget(meta.id); } render(); });
      });
    };
    return el;
  }

  function fishWord(n) {
    return n ? I18N.plural(n, 'fish') : I18N.t('home.card.empty');
  }

  function newTankTile() {
    var b = document.createElement('button');
    b.className = 'newtank';
    b.innerHTML = '<span class="plus">+</span><span>' + I18N.t('home.new') + '</span>';
    b.onclick = function () {
      Modal.prompt({
        title: I18N.t('home.create.title'),
        text: I18N.t('home.create.text'),
        value: I18N.t('home.create.value'),
        maxLength: 60,
        confirmLabel: I18N.t('home.create.ok')
      }).then(function (name) {
        if (name === null) return;
        b.disabled = true;
        return fetch('/api/tanks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name })
        })
          .then(function (r) { return r.json(); })
          .then(function (meta) {
            Tank.remember(meta.id);
            // Пароль сервер показывает один раз. На этом устройстве он
            // остаётся в браузере, так что переспрашивать его тут не будут —
            // а вот на телефоне или у второго родителя без него не обойтись.
            Tank.setPass(meta.id, meta.password);
            return Modal.alert({
              title: I18N.t('home.created.title'),
              text: I18N.t('home.created.text'),
              fields: [
                { label: I18N.t('home.created.code'), value: meta.id },
                { label: I18N.t('home.created.pass'), value: meta.password }
              ],
              okLabel: I18N.t('home.created.ok')
            }).then(function () { location.href = '/t/' + meta.id; });
          })
          .catch(function () {
            b.disabled = false;
            Modal.alert({
              title: I18N.t('home.create.fail.title'),
              text: I18N.t('home.create.fail.text')
            });
          });
      });
    };
    return b;
  }

  // Демо-аквариум: сервер отдаёт код, если хозяин настроил AQUA_DEMO_TANK.
  // Это самый короткий путь к «вау»: живой аквариум до того, как человек
  // хоть что-то завёл. Ссылка с ?demo — чтобы витрина не прописалась
  // в списке своих.
  var demoAsked = false;
  function askDemo() {
    if (demoAsked) return;
    demoAsked = true;
    fetch('/api/demo')
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d || !Tank.isValidId(d.id)) return;
        var a = document.getElementById('demo');
        a.href = '/t/' + d.id + '?demo';
        a.hidden = false;
      })
      .catch(function () { /* демо не настроено — блок живёт без кнопки */ });
  }

  function render() {
    var ids = Tank.known();
    box.textContent = '';
    empty.hidden = ids.length > 0;

    // Шаги — только новичку: у кого есть свой аквариум, тот дорогу знает.
    var how = document.getElementById('how');
    how.hidden = ids.length > 0;
    if (!how.hidden) askDemo();

    // Каждый аквариум спрашиваем отдельно: их немного, а батч-ручка ради
    // десятка запросов не окупается.
    Promise.all(ids.map(function (id) {
      return fetch('/api/t/' + id + '/meta')
        .then(function (r) { return r.ok ? r.json() : null; })
        .catch(function () { return null; });
    })).then(function (metas) {
      metas.forEach(function (meta, i) {
        // Аквариума нет на сервере — тихо убираем из списка, чтобы призраки
        // не копились после удалений с другого устройства.
        if (!meta) { Tank.forget(ids[i]); return; }
        box.appendChild(card(meta));
      });
      box.appendChild(newTankTile());
      empty.hidden = box.children.length > 1;
    });
  }

  document.getElementById('code-form').onsubmit = function (e) {
    e.preventDefault();
    var v = document.getElementById('code').value.trim().toLowerCase();
    if (!Tank.isValidId(v)) {
      Modal.alert({
        title: I18N.t('home.badcode.title'),
        text: I18N.t('home.badcode.text')
      });
      return;
    }
    location.href = '/t/' + v;
  };

  render();
})();
</script>
</body>
</html>
