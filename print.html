<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-t="print.title">Colouring sheets — ready to print</title>
<style>
  body { margin: 0; background: #223; font: 14px/1.5 "Segoe UI", system-ui, sans-serif; }
  .top { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 16px; padding: 12px 20px; background: #112; color: #eaf6ff; }
  .top h1 { font-size: 16px; margin: 0; flex: 1; }
  .top a { color: #58d6ff; text-decoration: none; font-size: 13px; }
  button { cursor: pointer; font: inherit; font-size: 13px; background: #58d6ff; border: 0; border-radius: 8px; padding: 7px 14px; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 24px 16px 60px; }
  .card { margin-bottom: 28px; }
  .bar { display: flex; align-items: center; justify-content: space-between; color: #eaf6ff; margin-bottom: 8px; }
  .sheet { display: block; width: 100%; background: #fff; box-shadow: 0 12px 40px rgba(0,0,0,.5); border-radius: 4px; }
  .note { color: #8aa; font-size: 13px; margin: 0 0 20px; }
  body.embed { background: none; }
  body.embed .top { position: static; background: none; padding: 4px 2px 0; }
  body.embed .top h1 { font-size: 15px; }
  body.embed .top a { display: none; }
  body.embed .wrap { padding: 14px 2px 6px; }
  body.embed .sheet { box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  @media print {
    @page { size: A4 landscape; margin: 0; }
    html, body, body.embed { margin: 0; padding: 0; background: #fff; }
    .top, .bar, .note { display: none; }
    .wrap, body.embed .wrap { max-width: none; margin: 0; padding: 0; }
    .card { margin: 0; break-inside: avoid; page-break-inside: avoid; }
    .card + .card { break-before: page; page-break-before: always; }
    .sheet { width: 100vw; height: 100vh; object-fit: contain; box-shadow: none; border-radius: 0; background: #fff; }
    body.one .card { display: none; break-before: auto; page-break-before: auto; }
    body.one .card.target { display: block; }
  }
</style>
</head>
<body>
<div class="top">
  <h1 data-t="print.title"></h1>
  <a href="/" data-t="print.home"></a>
  <button onclick="document.body.classList.remove('one'); print()" data-t="print.all"></button>
</div>
<div class="wrap">
  <p class="note" data-t="print.note"></p>
  <p class="note" data-t="print.note2"></p>
  <div id="list"></div>
</div>
<script src="/assets/i18n.js"></script>
<script>
var EMBED = new URLSearchParams(location.search).has('embed');
if (EMBED) document.body.classList.add('embed');

function frameHeight() {
  return Math.max(document.body.scrollHeight, (window.Modal && Modal.height && Modal.height()) || 0);
}

if (EMBED && window.parent !== window) {
  var tellHeight = function () {
    try { window.parent.postMessage({ aqua: 'height', height: frameHeight() }, location.origin); } catch (e) {}
  };
  if (window.ResizeObserver) new ResizeObserver(tellHeight).observe(document.body);
  addEventListener('load', tellHeight);
  tellHeight();
}

function printOne(name) {
  document.body.classList.add('one');
  document.querySelectorAll('.card').forEach(function (c) {
    c.classList.toggle('target', c.dataset.fish === name);
  });
  print();
}

function sheetOf(f) {
  return '/' + ((f.sheets && f.sheets[I18N.lang]) || f.sheets.en || f.svg).replace(/^\//, '');
}

function titleOf(f) {
  return (f.titles && (f.titles[I18N.lang] || f.titles.en)) || f.name;
}

fetch('/assets/coloring/manifest.json')
  .then(function (r) { return r.json(); })
  .then(function (m) {
    var list = document.getElementById('list');
    m.fish.forEach(function (f) {
      var card = document.createElement('div');
      card.className = 'card';
      card.dataset.fish = f.name;

      var bar = document.createElement('div');
      bar.className = 'bar';
      var b = document.createElement('b');
      var btn = document.createElement('button');
      btn.setAttribute('data-t', 'print.one');
      btn.textContent = I18N.t('print.one');
      btn.onclick = function () { printOne(f.name); };
      bar.appendChild(b);
      bar.appendChild(btn);

      var img = document.createElement('img');
      img.className = 'sheet';
      img.loading = 'lazy';

      var retitle = function () {
        b.textContent = img.alt = titleOf(f);
        img.src = sheetOf(f);
      };
      retitle();
      addEventListener('aqua:lang', retitle);

      card.appendChild(bar);
      card.appendChild(img);
      list.appendChild(card);
    });
  })
  .catch(function () {
    document.getElementById('list').textContent = I18N.t('print.nomanifest');
  });
</script>
</body>
</html>
