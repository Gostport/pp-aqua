# Аквариум за Caddy: сервер не умеет HTTPS и не должен — сертификат берёт
# на себя прокси. Наружу торчит только он.
#
# Что нужно рядом с этим файлом:
#   .env    — AQUA_DOMAIN=aqua.example.com и почта для Let's Encrypt
#   pack/   — собранный пак моделей (в репозиторий он не входит)
#   data/   — аквариумы; создаётся сам, но владельца проставить надо

services:
  aqua:
    build: .
    restart: unless-stopped
    environment:
      # Пределы на случай, когда ссылку узнал кто-то лишний. Подробности —
      # в LIMITS в server.js.
      AQUA_MAX_TANKS: ${AQUA_MAX_TANKS:-200}
      AQUA_TANKS_PER_HOUR: ${AQUA_TANKS_PER_HOUR:-5}
      AQUA_MAX_FISH: ${AQUA_MAX_FISH:-40}
      AQUA_MAX_BG: ${AQUA_MAX_BG:-8}
      AQUA_MAX_DATA_MB: ${AQUA_MAX_DATA_MB:-2048}
    volumes:
      # Аквариумы переживают пересборку образа.
      - ./data:/app/data
      # Купленный пак: лежит на сервере, в git его нет. Только чтение.
      - ./pack:/app/assets/models/pack:ro
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      AQUA_DOMAIN: ${AQUA_DOMAIN}
      AQUA_EMAIL: ${AQUA_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # сертификаты; потеря = новые запросы к Let's Encrypt
      - caddy_config:/config
    depends_on:
      - aqua

volumes:
  caddy_data:
  caddy_config:
