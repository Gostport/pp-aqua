          text_exts = {'.js', '.html', '.css', '.ps1', '.yml', '.yaml'}
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in text_exts:
                  continue
              if '.git' in p.parts:
                  continue
              t = p.read_text(encoding='utf-8-sig')
              if p.suffix.lower() in {'.js', '.html', '.css'}:
                  t = re.sub(r'^\s*//.*$', '', t, flags=re.M)
                  t = re.sub(r'^\s*/\*.*?\*/\s*$', '', t, flags=re.M | re.S)
                  t = re.sub(r'^\s*<!--.*?-->\s*$', '', t, flags=re.M | re.S)
              elif p.suffix.lower() == '.ps1':
                  t = re.sub(r'^\s*#.*$', '', t, flags=re.M)
              elif p.suffix.lower() in {'.yml', '.yaml'}:
                  t = re.sub(r'^\s*#.*$', '', t, flags=re.M)
              p.write_text(t, encoding='utf-8')

          for p in root.rglob('*.html'):
              if '.git' in p.parts:
                  continue
              t = p.read_text(encoding='utf-8')
              t = t.replace('<html lang="ru">', '<html lang="en">')
              p.write_text(t, encoding='utf-8')

          stale = []
          cyr = []
          for p in root.rglob('*'):
              if not p.is_file() or '.git' in p.parts:
                  continue
              if p.stat().st_size > 2_000_000:
                  continue
              try:
                  t = p.read_text(encoding='utf-8')
              except Exception:
                  continue
              if re.search(r'MrMoT9I|mrmot9i|paper-aquarium|aquarium\.mrmot9i\.com|/opt/docker/apps/paper-aquarium|mikalai|купил 3д рыбок', t, re.I):
                  stale.append(str(p))
              if re.search(r'[\u0400-\u04FF]', t):
                  cyr.append(str(p))

          print('Post-cleanup stale-reference matches:', stale or '(none)')
          print('Post-cleanup Cyrillic files:', cyr or '(none)')
          if stale or cyr:
              raise SystemExit(1)

          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', '-A'], check=True)
          subprocess.run(['git', 'commit', '-m', 'chore: remove Russian and upstream references'], check=True)
          subprocess.run(['git', 'push'], check=True)
          PY

      - name: Remove this one-shot workflow
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/english-cleanup.yml
          git commit -m 'chore: remove one-shot cleanup workflow'
          git push
